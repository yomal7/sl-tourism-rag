[project]
name = "sl-tourism-rag"
version = "0.1.0"
description = "Multimodal RAG system for Sri Lanka Tourism (SCS 4203 - Database III)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pillow>=10.4",
    "ollama>=0.3",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.5",
    "requests>=2.32",
    "python-multipart>=0.0.9",
]

# This is an application, not a library other projects will import, so we
# don't need a build backend / packaging metadata — just a dependency set.
[tool.uv]
package = false
